name: Create v1.0.1 Tag

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-v1.0.1-tag-once.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v1.0.1 tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v1.0.1" >/dev/null 2>&1; then
            exit 0
          fi
          git tag v1.0.1 "$GITHUB_SHA"
          git push origin v1.0.1
