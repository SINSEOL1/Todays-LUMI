name: Publish v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.1-once.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout v1.0.1
        uses: actions/checkout@v4
        with:
          ref: v1.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/TodaysLUMI/TodaysLUMI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=1.0.1 `
            -p:AssemblyVersion=1.0.1.0 `
            -p:FileVersion=1.0.1.0 `
            --output publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=1.0.1" `
            "installer\TodaysLUMI.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: 오늘의 루미 v1.0.1
          body: |
            # 오늘의 루미 v1.0.1

            이번 버전은 경기 중 LUMI 아이템이 다른 채팅 문구 때문에 바뀌는 문제를 수정한 핫픽스입니다.

            ## 수정 사항

            - LUMI 아이템을 한 번 정상 감지하면 **해당 경기에서는 값을 고정**합니다.
            - 아이템 확정 이후에는 채팅 영역 자동 인식을 **즉시 중단**합니다.
            - 일반 채팅의 `운석`, 이동 안내 등 비슷한 색상 문구가 표시되어도 현재 LUMI 아이템을 덮어쓰지 않습니다.
            - 다음 경기에서는 로비 진입이 감지되면 자동 인식을 다시 시작합니다.
            - 사용자가 **다시 인식**을 누른 경우에만 현재 경기에서 수동으로 인식을 다시 시작할 수 있습니다.

            > 예: 이번 경기 LUMI가 포스 코어로 확정되었다면 이후 채팅에 운석 관련 문구가 나타나도 포스 코어 상태를 유지합니다.
          files: installer/output/TodaysLUMI-Setup-v1.0.1.exe
          make_latest: true
