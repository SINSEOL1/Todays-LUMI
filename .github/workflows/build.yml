name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/TodaysLUMI/TodaysLUMI.csproj

      - name: Build
        run: dotnet build src/TodaysLUMI/TodaysLUMI.csproj --configuration Release --no-restore

      - name: Publish test build
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          dotnet publish src/TodaysLUMI/TodaysLUMI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/test-build

      - name: Upload test build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: TodaysLUMI-Windows-test
          path: artifacts/test-build/
          if-no-files-found: error
          retention-days: 14
