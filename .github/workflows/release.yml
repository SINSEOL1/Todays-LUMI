name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/TodaysLUMI/TodaysLUMI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:AssemblyVersion=${{ steps.version.outputs.value }}.0 `
            -p:FileVersion=${{ steps.version.outputs.value }}.0 `
            --output publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            "installer\TodaysLUMI.iss"

      - name: Create checksum
        shell: pwsh
        run: |
          $file = "installer\output\TodaysLUMI-Setup-v${{ steps.version.outputs.value }}.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  TodaysLUMI-Setup-v${{ steps.version.outputs.value }}.exe" |
            Out-File -Encoding ascii "installer\output\checksums.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/output/TodaysLUMI-Setup-v${{ steps.version.outputs.value }}.exe
            installer/output/checksums.txt
