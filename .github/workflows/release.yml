name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          if ($tag -notmatch '^v([0-9]+)\.([0-9]+)\.([0-9]+)$') {
            throw "Release tag must use vA.B.C format. Example: v1.0.0"
          }

          $version = $tag.Substring(1)
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/TodaysLUMI/TodaysLUMI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:AssemblyVersion=${{ steps.version.outputs.value }}.0 `
            -p:FileVersion=${{ steps.version.outputs.value }}.0 `
            --output publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            "installer\TodaysLUMI.iss"

      - name: Create SHA-256
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $file = "installer\output\TodaysLUMI-Setup-v$version.exe"
          $checksumFile = "installer\output\TodaysLUMI-Setup-v$version.sha256.txt"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()

          "$hash  TodaysLUMI-Setup-v$version.exe" |
            Out-File -Encoding ascii $checksumFile

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 오늘의 루미 v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            installer/output/TodaysLUMI-Setup-v${{ steps.version.outputs.value }}.exe
            installer/output/TodaysLUMI-Setup-v${{ steps.version.outputs.value }}.sha256.txt
